<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 소개 페이지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.7;
    }
    .container {
      max-width: 760px;
      margin: 60px auto;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .profile {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
    }
    h1 { margin-bottom: 10px; }
    .intro { font-size: 18px; }
    .section {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
    }
    .tags span {
      display: inline-block;
      margin: 5px;
      padding: 8px 14px;
      background: #eee;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- profile.jpg 파일을 index.html과 같은 폴더에 넣으세요 -->
    <img class="profile" src="ella.png" alt="프로필 이미지">

    <!-- 아래 내용을 나의 정보로 수정하세요 -->
    <h1>안녕하세요. 저는 엘라입니다.</h1>
    <p class="intro">
      인생은 집으로 가는 여행이다<br>
      Life's a voyage that's homeward bound.<br>
      - Herman Melville -<br>
    </p>

    <section class="section">
      <h2>요즘 관심있는 것</h2>
      <div class="tags">
        <span>걷기</span>
        <span>시.꽃</span>
        <span>나눔</span>
        <span>필사</span>
        <span>독서</span>
      </div>
    </section>

    <section class="section">
      <h2>앞으로 해보고 싶은 일</h2>
      <p>AI를 활용하고 새로운 취미와 활동에 도전하고 싶습니다.</p>
    </section>
  </main>
</body>
</html>
