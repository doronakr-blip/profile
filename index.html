<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-6">

    <!-- 메인 프로필 카드 (화면 중앙 배치) -->
    <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 sm:p-10 text-center border border-slate-100 transition-all">
        
        <!-- 1. 프로필 사진 -->
        <div class="relative w-32 h-32 mx-auto mb-6">
            <img 
                src="ellahorse.png" 
                alt="프로필 사진" 
                class="w-full h-full object-cover rounded-full shadow-md border-4 border-white ring-2 ring-slate-100"
                onerror="this.onerror=null; this.src='https://placehold.co/160x160/e2e8f0/475569?text=Profile';"
            />
        </div>

        <!-- 2. 이름 -->
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">
            엘라
        </h1>

        <!-- 3. 한 줄 소개 -->
        <p class="text-indigo-600 font-medium text-sm sm:text-base mt-2 mb-6">
            저는 말을 좋아합니다
        </p>

        <hr class="border-slate-100 my-6">

        <!-- 4. 3~4줄 짧은 자기소개 -->
        <p class="text-slate-600 text-sm sm:text-base leading-relaxed text-center font-normal whitespace-pre-line">
            인생은 집으로 가는 여행이다
            Life's a voyage that's homeward bound.
            - Herman Melville -
        </p>

    </main>

</body>
</html>
